[project]
name = "video-studio"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Self-hosted video production workflows for people and agents"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pillow>=11,<13",
  "requests>=2.32,<3",
  "pypinyin==0.55.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools", "tests"]
pythonpath = ["tools", "tools/dashboard", "."]
addopts = "--import-mode=importlib"
