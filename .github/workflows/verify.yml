name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.10.6'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Install Linux media prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libssl-dev pkg-config
      - name: Install macOS media prerequisites
        if: runner.os == 'macOS'
        run: brew install ffmpeg espeak-ng
      - name: Select the macOS Swift toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          /usr/bin/swift --version
      - name: Verify source and workflow regressions
        run: scripts/verify
      - name: Verify template
        working-directory: templates/narrated/remotion
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
      - name: Verify example contract
        run: uv run --locked pytest -q examples/narrated/cue-driven-demo/tests
