version: 2
updates:
  - package-ecosystem: cargo
    directory: /pipeline
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pre-1.0 minor releases can break the hashing API.
      - dependency-name: sha2
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /templates/narrated/remotion
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      remotion-family:
        patterns: ["remotion", "@remotion/*"]
        update-types: [minor, patch]
      remotion-security:
        applies-to: security-updates
        patterns: ["remotion", "@remotion/*"]
      javascript-compatible:
        patterns: ["*"]
        exclude-patterns: ["remotion", "@remotion/*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Optional model runtimes need a real G2P/model acceptance run. These
      # version-only rules do not disable Dependabot security updates.
      - dependency-name: onnxruntime
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: torch
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: transformers
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
